<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AIH - Registration Gateway</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root[data-theme="dark"] {
            --bg: #090d16;
            --surface: #111827;
            --surface-card: #1f2937;
            --border: rgba(255, 255, 255, 0.08);
            --text-main: #f9fafb;
            --text-muted: #9ca3af;
            --input-bg: #030712;
            --primary: #0a4da2;
            --primary-light: #3b82f6;
            --shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 10px 10px -5px rgba(0, 0, 0, 0.4);
            --focus-ring: rgba(59, 130, 246, 0.35);
        }
        :root[data-theme="light"] {
            --bg: #f3f4f6;
            --surface: #ffffff;
            --surface-card: #f9fafb;
            --border: rgba(0, 0, 0, 0.08);
            --text-main: #111827;
            --text-muted: #6b7280;
            --input-bg: #ffffff;
            --primary: #0a4da2;
            --primary-light: #1e70e0;
            --shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.05), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            --focus-ring: rgba(10, 77, 162, 0.15);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; transition: background-color 0.3s ease, border-color 0.3s ease; }
        
        body { 
            background-color: var(--bg); 
            color: var(--text-main); 
            min-height: 100vh; 
            display: flex; 
            flex-direction: column;
            align-items: center; 
            justify-content: center; 
            padding: 24px;
            position: relative;
        }

        .theme-toggle-wrapper {
            position: absolute;
            top: 24px;
            right: 24px;
        }

        .theme-btn { 
            background: var(--surface); 
            border: 1px solid var(--border); 
            color: var(--text-main); 
            width: 42px; 
            height: 42px; 
            border-radius: 12px; 
            cursor: pointer; 
            display: flex; 
            align-items: center; 
            justify-content: center;
            box-shadow: var(--shadow);
            transition: transform 0.2s ease, background-color 0.2s ease;
        }
        .theme-btn:hover {
            transform: translateY(-2px);
            background: var(--surface-card);
        }
        
        .form-card { 
            background: var(--surface); 
            border: 1px solid var(--border); 
            border-radius: 24px; 
            padding: 40px 32px; 
            width: 100%; 
            max-width: 450px; 
            box-shadow: var(--shadow); 
        }
        
        .header { margin-bottom: 28px; text-align: center; }
        
        .logo { 
            width: 52px; 
            height: 52px; 
            background: linear-gradient(135deg, var(--primary), var(--primary-light)); 
            border-radius: 14px; 
            display: inline-flex; 
            align-items: center; 
            justify-content: center; 
            color: white; 
            font-weight: 800; 
            font-size: 18px; 
            margin-bottom: 16px; 
            box-shadow: 0 8px 16px -4px rgba(10, 77, 162, 0.3);
        }
        
        h2 { font-size: 24px; font-weight: 800; letter-spacing: -0.5px; margin-bottom: 6px; }
        p.sub { font-size: 14px; color: var(--text-muted); line-height: 1.5; }
        
        .form-group { margin-bottom: 20px; }
        
        label { 
            display: block; 
            font-size: 11px; 
            font-weight: 700; 
            color: var(--text-muted); 
            margin-bottom: 8px; 
            text-transform: uppercase; 
            letter-spacing: 0.75px; 
        }
        
        .form-control { 
            width: 100%; 
            padding: 14px 16px; 
            border-radius: 12px; 
            background: var(--input-bg); 
            border: 1px solid var(--border); 
            color: var(--text-main); 
            font-size: 14px; 
            font-weight: 500;
            outline: none; 
            transition: all 0.2s ease; 
        }
        .form-control:focus { 
            border-color: var(--primary-light); 
            box-shadow: 0 0 0 4px var(--focus-ring);
        }
        
        .btn { 
            width: 100%; 
            padding: 14px; 
            border: none; 
            border-radius: 12px; 
            background: var(--primary); 
            color: white; 
            font-size: 15px; 
            font-weight: 700; 
            cursor: pointer; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            gap: 8px; 
            margin-top: 28px; 
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(10, 77, 162, 0.2);
        }
        .btn:hover { 
            background: var(--primary-light); 
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(10, 77, 162, 0.3);
        }
        .btn:active { transform: translateY(1px); }
        
        #msgBox { 
            margin-top: 20px; 
            padding: 14px; 
            border-radius: 12px; 
            font-size: 13.5px; 
            text-align: center; 
            display: none; 
            font-weight: 600; 
            line-height: 1.4;
        }
        .msg-success { background: rgba(16,185,129,0.12); color: #10b981; border: 1px solid rgba(16,185,129,0.25); }
        .msg-error { background: rgba(239,68,68,0.12); color: #ef4444; border: 1px solid rgba(239,68,68,0.25); }

        .hub-footer {
            margin-top: 24px;
            text-align: center;
            font-size: 13px;
            color: var(--text-muted);
            font-weight: 500;
        }
        .hub-link {
            color: var(--primary-light);
            text-decoration: none;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            transition: color 0.2s ease;
        }
        .hub-link:hover {
            color: var(--primary);
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="theme-toggle-wrapper">
        <button class="theme-btn" onclick="toggleGatewayTheme()">
            <span class="material-symbols-outlined" style="font-size: 20px;" id="themeIcon">light_mode</span>
        </button>
    </div>

    <div class="form-card">
        <div class="header">
            <div class="logo">AIH</div>
            <h2>Join Portal Directory</h2>
            <p class="sub">Submit your identity fields to register with command cells.</p>
        </div>
        <form id="publicSignupForm" onsubmit="submitFormPayload(event)">
            <div class="form-group">
                <label>Profile Full Name</label>
                <input type="text" id="regName" class="form-control" required placeholder="e.g. John Doe">
            </div>
            <div class="form-group">
                <label>Target Phone Number</label>
                <input type="tel" id="regPhone" class="form-control" required placeholder="e.g. 054XXXXXXX">
            </div>
            <div class="form-group">
                <label>Segment Channel Track</label>
                <select id="regLevel" class="form-control">
                    <option value="general">General Broadcast Members</option>
                    <option value="students">Students Channel Only</option>
                    <option value="business">Business Systems</option>
                </select>
            </div>
            <button type="submit" class="btn">Register Profile Node</button>
        </form>
        <div id="msgBox"></div>
        
        <div class="hub-footer">
            Visit our core engine at <a href="https://www.azzinternethub.space" target="_blank" class="hub-link">Azz Internet Hub <span class="material-symbols-outlined" style="font-size: 14px;">open_in_new</span></a>
        </div>
    </div>

    <script>
        const BACKEND_URL = "https://script.google.com/macros/s/AKfycbzOAB5UrGTjjF5tZrDDkC8_xjitJh_HRRrrr-Lhm0H1RnA3qFstwp-B7Tnv6Yqv90Q3wQ/exec";

        function toggleGatewayTheme() {
            const doc = document.documentElement;
            const currentTheme = doc.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
            doc.setAttribute('data-theme', currentTheme);
            document.getElementById('themeIcon').textContent = currentTheme === 'dark' ? 'light_mode' : 'dark_mode';
        }

        function submitFormPayload(e) {
            e.preventDefault();
            const msg = document.getElementById('msgBox');
            msg.style.display = 'none';

            const payload = {
                name: document.getElementById('regName').value.trim(),
                phone: document.getElementById('regPhone').value.trim(),
                level: document.getElementById('regLevel').value
            };

            const uniqueCallbackName = "jsonp_signup_" + Math.round(Math.random() * 100000);
            window[uniqueCallbackName] = function(res) {
                delete window[uniqueCallbackName];
                document.getElementById(uniqueCallbackName).remove();
                if(res && res.success) {
                    msg.className = "msg-success";
                    msg.textContent = res.message;
                    document.getElementById('publicSignupForm').reset();
                } else {
                    msg.className = "msg-error";
                    msg.textContent = res ? res.message : "System tracking timeout.";
                }
                msg.style.display = 'block';
            };

            const loaderUrl = BACKEND_URL + "?action=PUBLIC_SIGNUP&data=" + encodeURIComponent(JSON.stringify(payload)) + "&callback=" + uniqueCallbackName;
            const scriptTag = document.createElement("script");
            scriptTag.id = uniqueCallbackName;
            scriptTag.src = loaderUrl;
            document.body.appendChild(scriptTag);
        }
    </script>
</body>
</html>
